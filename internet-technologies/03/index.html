<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР 3 — Работа с API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Каталог пользователей</h1>

    <section class="controls">
      <button id="loadButton">Загрузить</button>
      <button id="reloadButton" disabled>Обновить</button>

      <input
        id="filterInput"
        type="text"
        placeholder="Поиск по имени, username или email"
        disabled
      >
    </section>

    <section class="info">
      <p id="status">Данные ещё не загружены.</p>
      <p id="statistics"></p>
    </section>

    <section id="users" class="users"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
